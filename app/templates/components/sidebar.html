<div class="sidebar d-flex flex-column" id="sidebarMenu">
    <!-- Brand Logo -->
    <div class="p-4 d-flex align-items-center justify-content-between">
        <a class="logo text-white d-flex align-items-center text-decoration-none" href="/">
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="var(--accent)" class="bi bi-robot me-2" viewBox="0 0 16 16">
                <path d="M6 12.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5ZM3 8.062C3 6.76 4.235 5.765 5.53 5.889a2.89 2.89 0 0 0 2.526-2.526C8.18 2.067 9.423 1 10.725 1c1.298 0 2.378.932 2.508 2.228.13.13.256.262.385.39.293.284.588.567.886.852a1.002 1.002 0 0 1 .31.691 1 1 0 0 1-.295.698l-.872.871A2.905 2.905 0 0 0 13 8.062C13 9.363 11.765 10.358 10.47 10.234a2.89 2.89 0 0 0-2.526 2.526c-.124 1.296-1.368 2.363-2.669 2.363-1.298 0-2.378-.932-2.508-2.228a1.003 1.003 0 0 1-.31-.692 1 1 0 0 1 .295-.697l.872-.871A2.905 2.905 0 0 0 3 8.062ZM1 5h1a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1H1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1ZM15 5h1a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1h-1a1 1 0 0 0-1 1v1a1 1 0 0 0 1 1Z"/>
            </svg>
            <span class="fw-bold">DocuMind <span style="color: var(--accent);">AI</span></span>
        </a>
        <button class="btn btn-link text-white d-lg-none p-0" onclick="toggleSidebar()" aria-label="Close sidebar">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-x" viewBox="0 0 16 16"><path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/></svg>
        </button>
    </div>

    <!-- Navigation Items -->
    <div class="flex-grow-1 px-3 py-2 d-flex flex-column gap-1">
        <a class="navitem d-flex align-items-center px-3 py-2 rounded-3 text-white text-decoration-none {% if request.path == url_for('dashboard.index') %}active{% endif %}" href="{{ url_for('dashboard.index') }}">
            <i class="bi bi-grid-1x2-fill me-3"></i>
            <span>Overview</span>
        </a>
        <a class="navitem d-flex align-items-center px-3 py-2 rounded-3 text-white text-decoration-none {% if request.path.startswith('/documents') %}active{% endif %}" href="{{ url_for('documents.index') }}">
            <i class="bi bi-file-earmark-text-fill me-3"></i>
            <span>Documents</span>
        </a>
        <a class="navitem d-flex align-items-center px-3 py-2 rounded-3 text-white text-decoration-none {% if request.path == '/financial-intelligence' %}active{% endif %}" href="/financial-intelligence">
            <i class="bi bi-graph-up-arrow me-3"></i>
            <span>Financial Intelligence</span>
        </a>
        <a class="navitem d-flex align-items-center px-3 py-2 rounded-3 text-white text-decoration-none {% if request.path == '/diligence' %}active{% endif %}" href="/diligence">
            <i class="bi bi-shield-check-fill me-3"></i>
            <span>Due Diligence</span>
        </a>
        <a class="navitem d-flex align-items-center px-3 py-2 rounded-3 text-white text-decoration-none {% if request.path == '/assistant' %}active{% endif %}" href="/assistant">
            <i class="bi bi-chat-dots-fill me-3"></i>
            <span>AI Assistant</span>
        </a>
        <a class="navitem d-flex align-items-center px-3 py-2 rounded-3 text-white text-decoration-none {% if request.path == '/reports' %}active{% endif %}" href="/reports">
            <i class="bi bi-bar-chart-fill me-3"></i>
            <span>Reports</span>
        </a>
    </div>

    <!-- Bottom User Section -->
    <div class="p-3 border-top border-secondary border-opacity-10 d-flex flex-column gap-2">
        <div class="d-flex align-items-center px-3 py-2">
            <div class="bg-primary text-white rounded-circle p-2 me-2 d-flex align-items-center justify-content-center fw-bold text-uppercase" style="width: 36px; height: 36px; font-size: 14px;">
                {{ current_user.username[:2] }}
            </div>
            <div class="text-truncate">
                <span class="d-block text-white fw-semibold small text-truncate" title="{{ current_user.username }}">{{ current_user.username }}</span>
                <span class="text-muted d-block text-truncate" style="font-size: 10px;" title="{{ current_user.email }}">{{ current_user.email }}</span>
            </div>
        </div>
        <a class="navitem d-flex align-items-center px-3 py-2 rounded-3 text-white text-decoration-none" href="#">
            <i class="bi bi-gear-fill me-3"></i>
            <span>Settings</span>
        </a>
        <form method="POST" action="{{ url_for('auth.logout') }}" style="margin: 0; padding: 0;">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit" class="navitem d-flex align-items-center px-3 py-2 rounded-3 text-danger text-decoration-none w-100 bg-transparent border-0" style="cursor: pointer; text-align: left;">
                <i class="bi bi-box-arrow-right me-3"></i>
                <span>Logout</span>
            </button>
        </form>
    </div>
</div>
